# Concept → files index for docs/help/.
#
# The weekly knowledge-refresh routine (see README.md) reads this file to map
# concept terms appearing in merged PRs to the help files that own them.
#
# Rules:
#   - Each concept appears in `concepts:` frontmatter of AT LEAST one file here.
#   - A file may own multiple concepts; a concept may be owned by multiple files.
#   - When a concept is split across files, the *primary* owner (the file that
#     defines the concept) is listed first.
#   - Add a concept here BEFORE adding it to any file's frontmatter — this list
#     is the controlled vocabulary.

