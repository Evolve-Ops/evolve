# docs/help/_pages.yaml — canonical admin-page ↔ help-doc registry.
#
# THE single source of truth that ties together, for every admin UI page:
#   page_id      ←→  the internal `data-page="…"` id in
#                    packages/admin/evolve_admin/web/index.html
#   label        ←→  the sidebar nav label the operator sees
#   bucket       ←→  the sidebar section it lives under
#   help_slug    ←→  the docs/help/<slug>.md that documents it (or null)
#   ui_surface   ←→  the `admin.<page_id>` string a help doc declares in its
#                    frontmatter to back-link to this page
#
# Why this file exists: those five facts were previously implicit and scattered
# across index.html, the help-doc frontmatter (`ui_surface:`), the Evo tray's
# per-page context, and AGENTS.md — with no registry tying them together. They
# drifted (help docs still pointed `ui_surface:` at retired page ids). This
# registry is the anti-drift backbone; `tools/help-coverage-lint` validates the
# live UI, this registry, and the help corpus against each other.
#
# Contract for each entry:
#   page_id     (str)  REQUIRED. Must match a literal data-page="…" in index.html.
#   label       (str)  REQUIRED. The sidebar label (operator-facing).
#   bucket      (str)  REQUIRED. Sidebar section: top | Operate | Improve |
#                      Settings | Developer. ("top" = the un-sectioned items
#                      above the first nav-section divider: Chat, Dashboard.)
#   help_slug   (str|null) REQUIRED. The docs/help slug documenting this page,
#                      or null when the page has no public help doc.
#   doc_status  (str)  REQUIRED. One of:
#                        present  — a docs/help/<help_slug>.md MUST exist; the
#                                   lint BLOCKS if it's missing (catches a doc
#                                   deleted/renamed out from under the registry).
#                        planned  — help_slug names the INTENDED slug for a doc
#                                   that doesn't exist yet; the lint WARNS
#                                   (actionable backlog), never blocks.
#                        none     — help_slug is null on purpose; the page
#                                   legitimately has no public doc.
#   purpose     (str)  REQUIRED. One line describing what the page is for.
#
# When you add or rename an admin page: add/edit its row here in the same PR.
# `tools/help-coverage-lint` will BLOCK a `data-page` in index.html that has no
# row here (and a row whose page_id no longer exists in index.html).

