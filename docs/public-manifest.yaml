  - docs/spec-darwin-pm-2026-07-02.md

# The docs/ allowlist (PD-3b, seeded from the PUB-1 Part A census of
# 2026-08-16, which reviewed every then-public docs/ path against spec
# §4.1's product-doc list). A docs/ path ships ONLY if it matches a glob
# here (and no `private` glob). New document classes are born private;
# adding a glob here is the explicit human act that makes a class public.
# When unsure, leave it private — reversing private→public later costs
# nothing; the other direction is the 08-15 incident.
#
# NOT listed by design: docs/PLACEHOLDER_NAMING.md (publish-time sanitize
# target — its own classification; it ships sanitized).
