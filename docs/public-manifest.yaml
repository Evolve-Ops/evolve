  # The publish workflow itself (2026-07-29). Not withheld for secrecy —
  # tools/publish-public and this manifest both ship — but because shipping it
  # is an active footgun: `on: push: branches: [main]` would fire inside the
  # PUBLIC repo on every force-pushed snapshot, and its body instructs a reader
  # to mint a PUBLIC_REPO_PUSH_TOKEN "on THIS (private) repo". In the public
  # repo it can only ever skip (no secret) or, if someone took that instruction
  # literally, force-push the repo to itself in a loop. It is publish
  # apparatus with no public consumer.
  - .github/workflows/publish-public.yml

  # Its drift alarm (2026-08-11), withheld for the same reason: shipped, its
  # `on: schedule` would fire inside the PUBLIC repo, comparing that repo to
  # itself on a cron and filing tracking issues there. Same class — publish
  # apparatus with no public consumer.
  - .github/workflows/publish-drift.yml

  # The full-history secret scan and its baseline (2026-08-11), withheld for the
  # same reason plus one of its own. Same class first: shipped, its `on:
  # schedule` would fire inside the PUBLIC repo and file tracking issues there,
  # against a snapshot that is a single fresh commit with no history to scan.
  # The reason of its own: the baseline is a list of THIS repo's private commit
  # SHAs and paths, and it is meaningless against the public repo's history —
  # every fingerprint would fail to match, so shipping it would also hand a
  # reader a map of private commits for no benefit.
  - .github/workflows/secret-history-scan.yml
  - .github/secret-history-scan/.gitleaksignore

  # Reference-deployment operational scripts — same class as
