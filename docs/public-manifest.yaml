# Source of truth for the public/private cut line when publishing to
# evolve-ops/evolve. Consumed by tools/publish-public and the CI guard
# (tools/check-public-manifest). Spec: docs/spec-public-2026-06-18.md §4.
#
# THE MODEL (PD-3b, 2026-08-15): `docs/**` is PRIVATE unless it matches
# `public_docs`. Everything else in the repo remains public unless it
# matches `private`. The `private` denylist wins on conflict, always.
# (The 08-15 leak proved a denylist cannot win the race against
# newly-invented document classes — see
# docs/incidents/incident-public-leak-2026-08-15.md. The docs/ globs under
# `private:` remain as belt-and-braces; PUB-2 may collapse them.)
#
# A third classification exists for docs/ paths: the publish-time
# sanitize targets (tools/publish_sanitize.py, e.g.
# docs/PLACEHOLDER_NAMING.md). They ship sanitized and are NEVER also
# allowlisted or denylisted here.
#
# REVERSAL (operator, 2026-07-02): the 2026-06-18 posture said the META
# coordinator system and the internal design corpus ship with the public
# repo ("DO NOT add these here — intentionally PUBLIC"). That decision is
# REVERSED: the public repo is the PRODUCT, not the dev methodology, and
# the META coordinator apparatus (registry, session guides, skills,
# tools/meta-*) indexes and paraphrases the withheld design specs — so
# shipping it would leak the corpus it coordinates. Both the internal
# design corpus (spec-/design-/decision-/research-/roadmap-/audit-/
# census-/runbook- docs) and the META apparatus are now denylisted.
#
# Still intentionally PUBLIC outside docs/ (do not denylist): CLAUDE.md,
# AGENTS.md, ONBOARDING.md, .claude/settings.json (sanitized at publish
# time by tools/publish_sanitize.py). The public docs/ corpus lives in
# `public_docs:` at the end of this file.
#
# Reconciliation invariant (tested in tools/test_publish_public.py and
# enforced per-path by tools/check-public-manifest): a docs/ path is
# allowlisted (`public_docs`), denylisted (`private`), or a sanitize
# target — AT MOST one, and (for docs/ paths) at least one.
#
# The operator-local meta-state/ ledgers and per-aspect memory files are
# NOT tracked in this repo at all (they live under the operator's
# ~/.claude/.../memory and a gitignored meta-state/), so they need no glob
# here — git ls-files never surfaces them to the publisher.
private:
  - docs/private/**          # already gitignored; defensive
  - issues/**                # internal issue tracker
  - docs/market-intelligence/**   # competitive strategy
  - docs/incidents/**        # reference-deployment ops incidents (billing/transcripts)
  - docs/forensic-*          # security incidents naming real bots
  - docs/diagnosis-*         # reference-deployment operational diagnoses
  - docs/diag-*

  # Internal design corpus (2026-07-02 reversal). Specs, design notes,
  # decisions, research, roadmaps, audits, censuses, and operational
  # runbooks are the dev methodology's paper trail, not product docs.
  # docs/runbook-* subsumes the three token-bearing runbooks previously
  # listed individually (PUBLIC-3) AND docs/runbook-public-cutover.md,
  # which therefore left the publish-time sanitize target set — a file is
  # either sanitized-and-shipped or denylisted, never both.
  - docs/spec-*
  - docs/design-*
  - docs/design/**
  - docs/decision-*
  - docs/research-*
  - docs/research/**         # market/positioning research — same class as market-intelligence
  - docs/roadmap-*
  - docs/audit-*
  - docs/census-*
  - docs/runbook-*

  # Product strategy + GTM + chip build briefs (2026-08-15, PUB-1). The
  # strategy docs are competitive positioning (same class as
  # market-intelligence); the build briefs and work orders index the
  # withheld design corpus by file:line. These four prefixes shipped to
  # the public repo on 08-15 because they were not yet denylisted — see
  # docs/incidents/incident-public-leak-2026-08-15.md. (The sibling globs
  # docs/MARCHING-ORDERS-* and docs/early-user-program.md land with the
  # branch that introduces those files — a glob matching zero tracked
  # files fails tools/check-public-manifest.)
  - docs/strategy-*
  - docs/build-*
  - docs/workorder-*         # execution work orders (H0–H3 plans; leaked 08-15 — see PUB-1)
  - docs/MARCHING-ORDERS-*   # dated internal marching orders; index the withheld corpus (PUB-1)
  - docs/early-user-program.md  # channel/competitor analysis + internal candor about alpha state

