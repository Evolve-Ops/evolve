# Source of truth for the public/private cut line when publishing to
# evolve-ops/evolve. Consumed by tools/publish-public and the CI guard
# (tools/check-public-manifest). Spec: internal/spec-public-2026-06-18.md §4.
#
# THE MODEL (PD-3c, 2026-08-15, physical boundary — supersedes PD-3b's
# logical one): `docs/` IS the public product-doc tree and holds nothing
# else; `internal/` holds every internal document and is denylisted
# wholesale. Everything outside both remains public unless it matches
# `private`. The `private` denylist wins on conflict, always.
#
# PD-3b's allowlist survives as the second lock on the one tree that does
# ship: a `docs/` path is PRIVATE unless it matches `public_docs`. So a new
# document class born under `docs/` still cannot merge unclassified — the
# guard fails it and tells the author to put it in `internal/`. (The 08-15
# leak proved a denylist cannot win the race against newly-invented
# document classes — see
# internal/incidents/incident-public-leak-2026-08-15.md. PUB-2 removed the
# per-prefix `docs/spec-*` / `docs/META-*` / ... denylist that stood in for
# that race: those prefixes no longer exist under `docs/`, so the globs were
# dead. Their content test is preserved in the spec's §4.1 census and in
# `internal/**`.)
#
# A third classification exists for docs/ paths: the publish-time
# sanitize targets (tools/publish_sanitize.py, e.g.
# docs/PLACEHOLDER_NAMING.md). They ship sanitized and are NEVER also
# allowlisted or denylisted here.
#
# REVERSAL (operator, 2026-07-02): the 2026-06-18 posture said the META
# coordinator system and the internal design corpus ship with the public
# repo ("DO NOT add these here — intentionally PUBLIC"). That decision is
# REVERSED: the public repo is the PRODUCT, not the dev methodology, and
# the META coordinator apparatus (registry, session guides, skills,
# tools/meta-*) indexes and paraphrases the withheld design specs — so
# shipping it would leak the corpus it coordinates. Both the internal
# design corpus (now `internal/**`) and the META apparatus are denylisted.
#
# Still intentionally PUBLIC outside docs/ (do not denylist): CLAUDE.md,
# AGENTS.md, ONBOARDING.md, .claude/settings.json (sanitized at publish
# time by tools/publish_sanitize.py). The public docs/ corpus lives in
# `public_docs:` at the end of this file.
#
# Reconciliation invariant (tested in tools/test_publish_public.py and
# enforced per-path by tools/check-public-manifest): a docs/ path is
# allowlisted (`public_docs`), denylisted (`private`), or a sanitize
# target — AT MOST one, and (for docs/ paths) at least one.
#
# The operator-local meta-state/ ledgers and per-aspect memory files are
# NOT tracked in this repo at all (they live under the operator's
# ~/.claude/.../memory and a gitignored meta-state/), so they need no glob
# here — git ls-files never surfaces them to the publisher. Repoint their
# `docs/...` references at `internal/...` once with
# `tools/meta-repoint-paths --apply`.
private:
  # PUB-2 (2026-08-21). The whole internal tree, denylisted wholesale: the
  # design corpus (spec-/design-/decision-/research-/roadmap-/audit-/census-/
  # runbook-), strategy + GTM + build briefs + work orders, the META
  # coordinator apparatus, market-intelligence/, incidents/, forensics,
  # diagnoses, the EDR dev-rig docs, dispatch/ and routines/, and every dated
  # one-off audit/finding/validation. One glob replaces ~60 per-prefix ones,
  # and — the point of the move — a NEW internal document class is private on
  # arrival with no manifest edit at all.
  - internal/**
  - docs/private/**          # already gitignored; defensive
  - issues/**                # internal issue tracker

  # Tombstone for a doc whose old path is cited outside this repo. It is a
  # two-line pointer at internal/early-user-program.md and carries none of
  # that doc's content, but it ships nowhere: the public repo has no
  # `internal/` tree, so a shipped pointer would be a dead link advertising
  # a withheld path. This is the ONLY tracked private path under docs/ —
  # everything else there is product doc. (PUB-2)
  - docs/early-user-program.md

  # META coordinator apparatus (2026-07-02 reversal) — the half that does
  # NOT live under internal/. The registry, session guides, procedure docs
  # and dispatch briefs moved to internal/** above; these are the code and
  # config surfaces that index and paraphrase the withheld design corpus.
  - .claude/skills/**        # the META coordinator skills (/meta, /status, /queue, ...)
  - .claude/meta.json        # META substrate parameterization
  - .claude/hooks/**         # dev-guardrail session hooks (pair with internal/dev-guardrails.md)
  - tools/meta-*
  - tools/meta_config.py
  - tools/test_meta_*.py
  - tools/hooks/meta-*
  - tools/hooks/test_meta_*
  - tools/hooks/prepend-meta-prefix.sh
  - tools/hooks/test_prepend_meta_prefix.sh
  - tools/hooks/record-dispatch-claim.sh
  - tools/hooks/test_record_dispatch_claim.sh
  - packages/admin/tests/test_meta_queue.py   # tests the denylisted tools/meta-queue

  # Token-bearing test fixtures. These embed the reserved bot/account
  # tokens BY DESIGN (they assert the scrub catches them, keep an
  # authoritative RESERVED_TOKENS copy, or use real names as fixtures).
  # They are exempt from the private-CI scrub via ALLOWLISTED_PATHS in
  # packages/admin/tests/test_public_launch_scrub.py, but that exemption
  # must NOT carry into the public output — denylist them so the public
  # repo never ships the embedded tokens. (PUBLIC-3)
  - packages/admin/tests/test_files_pack_integrity.py
  - packages/admin/tests/test_no_personal_pii_in_source.py
  - packages/admin/tests/test_public_launch_scrub.py
  - packages/analyzer/tests/test_oc_cli_dedup.py
  - packages/plugin/tests/turnObserver.chosenBy.test.mjs
  - tools/test_publish_public.py

  # The publish workflow itself (2026-07-29). Not withheld for secrecy —
  # tools/publish-public and this manifest both ship — but because shipping it
  # is an active footgun: `on: push: branches: [main]` would fire inside the
  # PUBLIC repo on every force-pushed snapshot, and its body instructs a reader
  # to mint a PUBLIC_REPO_PUSH_TOKEN "on THIS (private) repo". In the public
  # repo it can only ever skip (no secret) or, if someone took that instruction
  # literally, force-push the repo to itself in a loop. It is publish
  # apparatus with no public consumer.
  - .github/workflows/publish-public.yml

  # Its drift alarm (2026-08-11), withheld for the same reason: shipped, its
  # `on: schedule` would fire inside the PUBLIC repo, comparing that repo to
  # itself on a cron and filing tracking issues there. Same class — publish
  # apparatus with no public consumer.
  - .github/workflows/publish-drift.yml

  # The full-history secret scan and its baseline (2026-08-11), withheld for the
  # same reason plus one of its own. Same class first: shipped, its `on:
  # schedule` would fire inside the PUBLIC repo and file tracking issues there,
  # against a snapshot that is a single fresh commit with no history to scan.
  # The reason of its own: the baseline is a list of THIS repo's private commit
  # SHAs and paths, and it is meaningless against the public repo's history —
  # every fingerprint would fail to match, so shipping it would also hand a
  # reader a map of private commits for no benefit.
  - .github/workflows/secret-history-scan.yml
  - .github/secret-history-scan/.gitleaksignore

  # Reference-deployment operational scripts — same class as
  # internal/incidents/** (the runbooks of this class live under internal/**).
  - scripts/decommission_sentry_watchdog.sh

# The docs/ allowlist (PD-3b, seeded from the PUB-1 Part A census of
# 2026-08-16, which reviewed every then-public docs/ path against spec
# §4.1's product-doc list). A docs/ path ships ONLY if it matches a glob
# here (and no `private` glob). New document classes are born private;
# adding a glob here is the explicit human act that makes a class public.
# When unsure, leave it private — reversing private→public later costs
# nothing; the other direction is the 08-15 incident.
#
# Since PUB-2 this list is also the CENSUS of `docs/`: `git ls-files docs/`
# matches these globs plus the one sanitize target and the one tombstone.
# An internal doc written into `docs/` matches nothing here and fails CI —
# put it in `internal/`, which needs no manifest edit at all.
#
# NOT listed by design: docs/PLACEHOLDER_NAMING.md (publish-time sanitize
# target — its own classification; it ships sanitized).
public_docs:
  - docs/application-manifests.md
  - docs/applications-vs-skills.md
  - docs/applications.md
  - docs/architecture.md
  - docs/atlas-app-manifests/**   # importable reference app packages (product)
  - docs/calibration-schema.md
  - docs/configuration.md
  - docs/continuity-engine.md
  - docs/contributing-skills.md
  - docs/deployment-guide.md
  - docs/feedback-loop.md
  - docs/fixtures/**              # field-name oracle read by shipped code/tests
  - docs/getting-started.md
  - docs/gitpages/**              # the public site
  - docs/help/**                  # operator help corpus
  - docs/https-setup.md
  - docs/index.html
  - docs/local-deployment-architecture.md
  - docs/manifest-authoring-guide.md
  - docs/manifest-schema.json
  - docs/manifest-spec.md
  - docs/model-roles.md
  - docs/operator-message-style.md
  - docs/operator-runbook.md      # product troubleshooting runbook (not reference-deployment ops)
  - docs/overview.md
  - docs/policy/**                # engineering policy parsed by shipped tests (launchd scope)
  - docs/pre-install-checklist.md
  - docs/principle-*
  - docs/product-vision.md
  - docs/public-manifest.yaml     # this file — the cut line is public by design
  - docs/reference/**
  - docs/remote-operator-access.md
  - docs/schemas/**
  - docs/scripts.md
  - docs/skills/**                # per-integration setup guides
  - docs/slack-setup.md
  - docs/style-guide.md
  - docs/system/**                # runtime content injected into bot session prompts
  - docs/threat-model.md
  - docs/use-cases.md
  - docs/voice-guide.md
