# Source of truth for the public/private cut line when publishing to
# evolve-ops/evolve. Everything tracked is PUBLIC unless it matches a
# glob here. Consumed by tools/publish-public and the CI guard
# (tools/check-public-manifest). Spec: docs/spec-public-2026-06-18.md §4.
#
# The model is PUBLIC-BY-DEFAULT minus this denylist. The cut line is an
# explicit, small list of PRIVATE paths — NOT an allowlist of public ones.
# Adding a path here removes it from the published output.
#
# REVERSAL (operator, 2026-07-02): the 2026-06-18 posture said the META
# coordinator system and the internal design corpus ship with the public
# repo ("DO NOT add these here — intentionally PUBLIC"). That decision is
# REVERSED: the public repo is the PRODUCT, not the dev methodology, and
# the META coordinator apparatus (registry, session guides, skills,
# tools/meta-*) indexes and paraphrases the withheld design specs — so
# shipping it would leak the corpus it coordinates. Both the internal
# design corpus (spec-/design-/decision-/research-/roadmap-/audit-/
# census-/runbook- docs) and the META apparatus are now denylisted.
#
# Still intentionally PUBLIC (do not add): CLAUDE.md, AGENTS.md,
# ONBOARDING.md, .claude/settings.json (sanitized at publish time by
# tools/publish_sanitize.py); docs/system/** (runtime content injected
# into bot session prompts — product, not methodology); and the product
# doc corpus — architecture.md, deployment-guide.md, configuration.md,
# style-guide.md, docs/help/**, docs/gitpages/**, docs/schemas/**,
# docs/skills/**, docs/reference/**, docs/atlas-app-manifests/**,
# applications.md, applications-vs-skills.md, application-manifests.md,
# contributing-skills.md, docs/PLACEHOLDER_NAMING.md.
#
# Reconciliation invariant (tested in tools/test_publish_public.py): a
# path is either sanitized-and-shipped (a tools/publish_sanitize.py
# target) or denylisted here — NEVER both.
#
# The operator-local meta-state/ ledgers and per-aspect memory files are
# NOT tracked in this repo at all (they live under the operator's
# ~/.claude/.../memory and a gitignored meta-state/), so they need no glob
# here — git ls-files never surfaces them to the publisher.
private:
  - docs/private/**          # already gitignored; defensive
  - issues/**                # internal issue tracker
  - docs/market-intelligence/**   # competitive strategy
  - docs/incidents/**        # reference-deployment ops incidents (billing/transcripts)
  - docs/forensic-*          # security incidents naming real bots
  - docs/diagnosis-*         # reference-deployment operational diagnoses
  - docs/diag-*

  # Internal design corpus (2026-07-02 reversal). Specs, design notes,
  # decisions, research, roadmaps, audits, censuses, and operational
  # runbooks are the dev methodology's paper trail, not product docs.
  # docs/runbook-* subsumes the three token-bearing runbooks previously
  # listed individually (PUBLIC-3) AND docs/runbook-public-cutover.md,
  # which therefore left the publish-time sanitize target set — a file is
  # either sanitized-and-shipped or denylisted, never both.
  - docs/spec-*
  - docs/design-*
  - docs/design/**
  - docs/decision-*
  - docs/research-*
  - docs/research/**         # market/positioning research — same class as market-intelligence
  - docs/roadmap-*
  - docs/audit-*
  - docs/census-*
  - docs/runbook-*

  # META coordinator apparatus (2026-07-02 reversal). The registry,
  # session guides, procedure docs, dispatch briefs, coordinator skills,
  # and the tools/meta-* CLI surface index and paraphrase the withheld
  # design corpus.
  - docs/META-*
  - docs/meta-*
  - docs/using-the-meta-system.md
  - docs/dispatch/**
  - docs/routines/**
  - .claude/skills/**        # the META coordinator skills (/meta, /status, /queue, ...)
  - .claude/meta.json        # META substrate parameterization
  - .claude/hooks/**         # dev-guardrail session hooks (pair with docs/dev-guardrails.md)
  - tools/meta-*
  - tools/meta_config.py
  - tools/test_meta_*.py
  - tools/hooks/meta-*
  - tools/hooks/test_meta_*
  - tools/hooks/prepend-meta-prefix.sh
