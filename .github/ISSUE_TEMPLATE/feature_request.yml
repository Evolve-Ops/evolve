name: Feature request
description: Suggest a new capability or improvement for Evolve
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Most fields below will already be filled in
        if this issue was opened from the Evolve admin UI's "Send feedback" button.

        **How requests land here:** Evolve is developed in a private repository; this public
        repo is a per-release snapshot (see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md)).
        Accepted requests are built privately and ship in a future release; this issue is
        closed with a comment naming that release.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it, and how often?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: How could Evolve address this? Sketch a UX or API shape if you have one.

  - type: input
    id: evolve-version
    attributes:
      label: Evolve version
      placeholder: "e.g. 2026.5.5"
