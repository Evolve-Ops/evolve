# glossary.yaml — single source of truth for evo's domain glossary.
#
# Generated content in evo's AGENTS.md (the "Pod glossary" section)
# is rendered from this file at deploy time. The deploy step runs:
#
#   evolve-admin gen-evo-glossary
#
# which loads this YAML + the pod's network.json::evo_glossary_overrides,
# merges them, and renders a markdown block.
#
# Drift tests in packages/admin/tests/test_evo_glossary_drift.py
# verify EVERY chip in tile_metrics.py, EVERY signal producer call
# site, and EVERY analyzer/generators/<id>/ subdir has an entry below.
# A new chip/producer/generator without a YAML entry fails CI.
#
# Operator override:
#
#   network.json::evo_glossary_overrides:
#     chips:
#       cost_spike:
#         evo_urgency_default: act      # default is "depends"
#         evo_advice: "Our budget is tight; treat every spike as urgent."
#
# Overrides are merged per-entity at gen time. Operator's pod gets a
# customized GLOSSARY; the repo's default stays generic.
#
# Schema (v1):
#
#   chips:        list of tile-chip entries
#     id:                       (string, matches the chip id in tile_metrics.py)
#     severity:                 ("critical" | "warn" | "info" | "depends")
#     label:                    (operator-facing string)
#     scope:                    ("member_bot" | "primary_bot" | "any")
#     source_file:              (path; used for the drift cross-check)
#     fires_when:               (one-sentence condition)
#     evo_urgency_default:      ("act" | "defer" | "depends")
#     evo_advice:               (short prose; what evo should tell the operator)
#     verify_via_tool:          (read tool to confirm the chip after action;
#                                optional — most chips are observational)
#
#   producers:    list of signal-producer entries
#     id:                       (string, matches producer="X" in source)
#     source_file:              (where the call site lives)
#     monitors:                 (what the producer watches)
#     signal_types:             (representative signal type values)
#     sweep_resolves:           (bool — does it clear stale signals when conditions heal?)
#     evo_urgency_default:      ("act" | "defer" | "depends")
#     evo_advice:               (when to act vs defer for this producer's signals)
#
#   generators:   list of proposal-generator entries
#     id:                       (string, matches subdir under analyzer/generators/)
#     source_file:              (path to charter.yaml)
#     cadence:                  ("hourly" | "daily" | "weekly" | "per-session")
#     audience:                 ("pod_operator" | "bot_owner" | "primary_user" | ...)
#     watches:                  (what motivates a proposal)
#     proposes:                 (what kind of change)
#     action_kinds:             (list)
#     evo_urgency_default:      ("act" | "defer" | "depends")
#     evo_advice:               (when to encourage apply vs defer)

version: 1

# ── Tile chips (Dashboard pills) ─────────────────────────────────────────────

chips:

  - id: gateway_down
    severity: critical
    label: "gateway down"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      Bot's gateway process is not running OR unreachable
      (per status/{bot}.json written by heal.py every ~5m).
    evo_urgency_default: act
    evo_advice: >
      Bot can't process turns. Check pod_state(query="host") for daemon
      state; operator should restart from Maintenance → Status.

  - id: stale_heartbeat
    severity: depends
    label: "stale heartbeat"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      Critical: bot's status is 'offline'. Warn: status is 'active' but
      last metric file is >1 day old.
    evo_urgency_default: depends
    evo_advice: >
      Critical variant: act — bot's heartbeat probe is failing. Warn
      variant: observe; usually a day-rollover blip but can signal a
      developing outage.

  - id: version_drift
    severity: warn
    label: "version drift"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: bot_data.evolve_synced is False
    evo_urgency_default: defer
    evo_advice: >
      Bot still works but is missing recent fixes/features. Operator
      runs deploy at convenience.

  - id: unexpected_billing
    severity: warn
    label: "unexpected billing"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: sum of unexpected_billing_turns over 7d is >0
    evo_urgency_default: defer
    evo_advice: >
      Anomalous billing pattern (fallback behaviors, retry loops).
      Investigate via Cost tab, not urgent.

  - id: high_correction
    severity: warn
    label: "high correction"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      >10% of turns in the last 7d (≥20 turns) had the *user's
      incoming message* match a correction phrase aimed at the bot's
      previous reply ("no, i meant", "that's not what i", "you
      misunderstood", "not quite", "try again", "that's wrong",
      "incorrect", "you said you would", "you didn't", "still not",
      "that didn't work"). Plain substring match on lowercased text in
      packages/plugin/src/observer/TierClassifier.ts; the bot's own
      output is not inspected.
    evo_urgency_default: defer
    evo_advice: >
      The user is pushing back on the bot's prior turns often enough
      to clear the 10% threshold — the signal is user-initiated, not
      bot self-revision or model hedging. Likely causes: soul / prompt
      mismatch, model under-tier for the work, scope mismatch (user
      asks things outside the bot's apparent capability), or task-type
      drift since the soul was tuned. Defer; review recent session
      transcripts on the Sessions page (filter by corrections) when
      convenient to spot the dominant pattern.

  - id: scan_needed
    severity: warn
    label: "scan needed"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      applications/<bot>/.scan-status.json is missing OR >30 days old
      AND apps.total > 0
    evo_urgency_default: defer
    evo_advice: >
      Low priority unless apps.total > 5 — stale manifest hampers
      app audit but doesn't break anything. Operator runs scan from
      Applications tab.

  - id: cost_spike
    severity: warn
    label: "cost spike"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      current 7d cost > 2× prior 7d AND > $5 floor
    evo_urgency_default: depends
    evo_advice: >
      Act if unexplained (loop / misconfigured cron / genuine usage
      change). Defer if you know the cause.

  - id: security_critical
    severity: critical
    label: "N critical security"
    scope: member_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      Security audit found N critical findings for this bot
      (cached output of /api/security/audit).
    evo_urgency_default: act
    evo_advice: >
      Usually means exposed credentials, dangerous privilege grants,
      or policy violations. Fetch pod_state(query="audit", bot_id=...)
      for details.

  - id: repo_puller_stale
    severity: warn
    label: "repo-puller stale"
    scope: primary_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      Repo-puller daemon hasn't fetched in >20m
      (mtime of evolve-repo/.git/FETCH_HEAD).
    evo_urgency_default: depends
    evo_advice: >
      Investigate — check launchctl state for
      ai.evolve.evolve.repo-puller. Pod isn't getting new code.

  - id: infra_daemon_down
    severity: critical
    label: "infra daemon down"
    scope: primary_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      One or more of (repo-puller, heal, verify) not loaded in launchctl.
    evo_urgency_default: act
    evo_advice: Pod monitoring is degraded. Act now.

  - id: acl_drift
    severity: warn
    label: "ACL drift"
    scope: primary_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      `evolve` user has lost read ACL on one or more member bots'
      .openclaw/ dirs.
    evo_urgency_default: depends
    evo_advice: >
      Investigate. Evolve can't monitor those bots; operator may need
      to re-run the setup wizard's ACL step.

  - id: disk_high
    severity: depends
    label: "disk high"
    scope: primary_bot
    source_file: packages/analyzer/tile_metrics.py
    fires_when: >
      Disk holding shared_dir is ≥90% (warn) or ≥95% (critical).
    evo_urgency_default: depends
    evo_advice: >
      Act at critical (95%+). Defer at warn (90–94%) but plan cleanup.

# ── Signal producers ─────────────────────────────────────────────────────────

producers:

  - id: cost_watchdog
    source_file: packages/analyzer/cost_watchdog.py
    monitors: cost and automation telemetry hourly
    signal_types:
      - daily_spend_high
      - automation_dominance
      - cron_wakes_agent
      - cron_overactive
      - context_bloat
      - session_token_outlier
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Most are tuning suggestions; act on session_token_outlier
      (runaway sessions are serious) and cost_spike-style daily_spend_high.

  - id: bot_log_monitor
    source_file: packages/analyzer/bot_log_signal.py
    monitors: per-bot gateway error logs for known failure patterns
    signal_types:
      - max_auth_failure
      - discord_target_invalid
      - tool_delivery_failing
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      Act on max_auth_failure and discord/target_invalid; delivery_failing
      usually needs cross-bot debug.

  - id: deploy_drift_monitor
    source_file: packages/analyzer/deploy_drift_monitor.py
    monitors: per-bot deployed version vs admin code version
    signal_types: [deploy_drift]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: Bundled with next deploy; operator runs install-infra-jobs at convenience.

  - id: oc_cli
    source_file: packages/analyzer/signals/cli_misinvocation.py
    monitors: openclaw CLI invocations from evolve callers (inline guard in oc_cli.oc_command)
    signal_types: [cli_misinvocation]
    sweep_resolves: false
    evo_urgency_default: act
    evo_advice: >
      Update the evolve caller's openclaw invocation to match the
      current upstream CLI shape (missing requiredOption / renamed
      flag / changed positional arity). Persistent until the caller
      ships a fix; re-fires weekly while broken.

  - id: bot_recovery_monitor
    source_file: packages/analyzer/bot_recovery_monitor.py
    monitors: recovery from offline events
    signal_types: [bot_recovered]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: Informational; no action needed.

  - id: embedding_monitor
    source_file: packages/analyzer/embedding_monitor.py
    monitors: embedding provider health (gateway.err.log tail, hourly)
    signal_types:
      - provider_failing
      - rate_limit_storm
    sweep_resolves: false
    evo_urgency_default: act
    evo_advice: >
      Act on auth_failed (rotate key); inform on rate-limit storms
      (provider degraded; operator can't fix from pod side).

  - id: session_economics
    source_file: packages/analyzer/session_economics.py
    monitors: prompt-cache and bot-engagement patterns daily
    signal_types:
      - cache_invalidation_elevated
      - cache_hit_rate_low
      - bot_unused
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: >
      Most feed into proposals (cache_ttl_tuner, efficiency_hawk);
      defer to the proposal flow unless directly debugging.

  - id: permission_monitor
    source_file: packages/analyzer/permissions/monitor.py
    monitors: approvals, cron, openclaw config drift vs baseline hourly
    signal_types:
      - perm_config_drift
      - perm_config_dangerous_combo
      - perm_approvals_denylist_match
      - perm_approvals_volume_warn
      - perm_approvals_volume_alarm
      - perm_cron_uncapped_agent_turn
      - perm_cron_denylist_match
      - perm_cron_added_silently
      - perm_openclaw_config_missing
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Act on _denylist_match and _dangerous_combo (policy violations);
      defer on _volume_warn (tuning opportunity).

  - id: plugin_monitor
    source_file: packages/analyzer/plugins/monitor.py
    monitors: plugin inventory diff vs pod baseline hourly
    signal_types:
      - plugin_missing_required
      - plugin_denied_present
      - plugin_load_path_unexpected
      - plugin_install_source_unauthorized
      - plugin_unexpected_enabled
      - plugin_unexpected_disabled
      - plugin_allow_list_missing
      - plugin_allow_list_drift
      - plugin_command_gate_enabled
      - plugin_config_drift
      - plugin_openclaw_config_missing
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Act on _missing_required and _denied_present (policy
      violations); others are baseline-tuning opportunities.

  - id: hook_monitor
    source_file: packages/analyzer/hooks/monitor.py
    monitors: hook/webhook config drift vs baseline hourly
    signal_types:
      - hook_webhook_unexpected_enabled
      - hook_webhook_mapping_changed
      - hook_webhook_transforms_dir_drift
      - hook_plugin_policy_silent_disable
      - hook_plugin_policy_unexpected
      - hook_command_gate_enabled
      - hook_openclaw_config_missing
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Act on _webhook_unexpected_enabled and _plugin_policy_silent_disable
      (potential security drift).

  - id: alerts_loop_monitor
    source_file: packages/analyzer/alerts_loop_monitor.py
    monitors: alerts dispatcher log for failures and repeat-loops hourly
    signal_types:
      - dispatcher_failures
      - alert_repeat_loop
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      dispatcher_failures: check Discord/Telegram credentials.
      alert_repeat_loop: resolve the underlying condition (approve or
      revert the triggering proposal).

  - id: audit
    source_file: packages/analyzer/audit.py
    monitors: OC security audit (every 15 min)
    signal_types: [varies — per-finding signals from the audit catalog]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Severity drives urgency. Fetch pod_state(query="audit", bot_id=...)
      for finding-level detail when the operator asks.

  - id: integration_probe
    source_file: packages/analyzer/integration_probe.py
    monitors: per-bot integration health (Telegram / Slack / Google OAuth / etc.)
    signal_types: [varies per integration probe]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      Failure means a specific integration is broken end-to-end. Bot
      can't deliver to that channel until fixed.

  - id: error_reporter
    source_file: packages/analyzer/error_reporter.py
    monitors: surfaced exceptions from analyzer + admin daemons
    signal_types: [varies per error class]
    sweep_resolves: false
    evo_urgency_default: depends
    evo_advice: >
      Critical errors warrant immediate operator attention; recurring
      warnings are usually tuning opportunities.

  - id: gateway
    source_file: packages/analyzer/heal.py
    monitors: gateway-level events (restarts, failures, port conflicts)
    signal_types: [gateway_instability, gateway_restart, etc.]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      gateway_instability blocks bot operation; gateway_diagnostician
      proposes the heal config fix.

  - id: host_health
    source_file: packages/analyzer/host_health.py
    monitors: pod host CPU / memory / disk / load
    signal_types: [host_cpu_high, host_memory_high, host_disk_high, host_load_high]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Severity drives urgency. disk_high is the most actionable.

  - id: manifest_reflex_runner
    source_file: packages/analyzer/manifest_reflex_runner.py
    monitors: app-manifest reflex execution outcomes
    signal_types: [varies]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: >
      Tracks reflex-runner behavior; defer unless investigating an
      app-specific issue.

  - id: manifest_reflex_scanner
    source_file: packages/analyzer/manifest_reflex_scanner.py
    monitors: app-manifest reflex scanner outcomes
    signal_types: [varies]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: Same posture as manifest_reflex_runner.

  - id: pod_health
    source_file: packages/analyzer/pod_health.py
    monitors: pod-wide health rollup
    signal_types: [varies per dimension]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Severity drives urgency. Often the umbrella for several
      finer-grained producers.

  - id: pod_report
    source_file: packages/analyzer/pod_report.py
    monitors: pod-state rollup (daily report)
    signal_types: [varies]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: >
      Daily-report producer; most signals here are informational
      summaries.

  - id: registry
    source_file: packages/analyzer/generators/registry.py
    monitors: generator-registry health (charter drift, fingerprint mismatch)
    signal_types: [registry_drift, charter_fingerprint_mismatch]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      A drifted generator can produce stale or wrong proposals; act now.

  - id: security_warden
    source_file: packages/analyzer/generators/security_warden/
    monitors: security posture checks (also a proposal generator)
    signal_types:
      - multi_user_no_pod_admins
      - multi_user_no_primary_recorded
      - multi_user_exec_full_unscoped
      - openclaw_version_below_floor
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: Security drift is critical; act now.

  - id: sysadmin_watchdog
    source_file: packages/analyzer/generators/sysadmin_watchdog/
    monitors: platform-level failures (also a proposal generator)
    signal_types: [varies]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Act on critical findings (gateway down, daemon missing); defer
      on tuning-class signals.

  - id: evolve_watchdog
    source_file: packages/analyzer/generators/evolve_watchdog/
    monitors: RSI meta-health (also a proposal generator)
    signal_types: [varies]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: Evolve correcting itself is cascading risk; act now.

  - id: test_runner
    source_file: packages/analyzer/test_runner.py
    monitors: app-test execution results
    signal_types: [test_failed, test_passed_after_fail]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      test_failed blocks app readiness — paired with test_failure_responder
      proposal generator for the diagnosis.

  - id: budget_hawk
    source_file: packages/analyzer/generators/budget_hawk/signals.py
    monitors: pod-wide spend vs configured cap (also a proposal generator)
    signal_types: [pod_spend_near_cap, pod_spend_over_cap, billing_mode_drift]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      Cost cascades fast — act when near cap. Same entity also runs
      as a proposal generator that emits TierAdjustment etc.

  - id: mcp_monitor
    source_file: packages/analyzer/mcp_admin/monitor.py
    monitors: MCP server configuration on each bot vs the pod allowlist
    signal_types:
      - mcp_server_not_in_allowlist
      - mcp_server_signature_drift
      - mcp_launcher_missing
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      MCP drift means a bot is talking to a server the pod hasn't
      vetted, or a vetted server has changed its config. Act on
      _not_in_allowlist and _signature_drift; launcher_missing is
      usually a deploy-incomplete state.

  - id: backup_signal
    source_file: packages/analyzer/backup_signal.py
    monitors: per-bot nightly backup run-state (hourly launchd)
    signal_types: [backup_failing]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      Closes the May 2026 silent-failure gap (admin UI showed "✓ 65h
      ago" while every nightly run was bouncing). Warn at 3+ consecutive
      failures, escalates to alert at 7+. Operator retries via
      Maintenance → Backup "Backup now"; tooltip on the red badge shows
      the latest error.

  - id: breakers_runner
    source_file: packages/analyzer/breakers/runner.py
    monitors: auto-trip decisions from the activity-shape detector
    signal_types: [recurrent_breaker_trip]
    sweep_resolves: false
    evo_urgency_default: act
    evo_advice: >
      Fires only when a bot trips a second time within 48h on the same
      breaker type — pattern suggests a root cause that needs
      investigation rather than another reset. Trip is already in
      effect; this signal is the "look at why" prompt.

  - id: compliance_scan
    source_file: packages/admin/evolve_admin/applications/scanner.py
    monitors: per-bot manifest + workspace compliance (daily scan)
    signal_types:
      - stale
      - test_failing
      - missing_required_field
      - validation_error
      - unregistered_script
      - unregistered_cron
      - misplaced_secret
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Feeds the manifest_quality, workspace_inventory, and
      workspace_security generators (which emit Investigation
      proposals). Act on misplaced_secret (credential leak risk); defer
      on stale / test_failing / unregistered_* (operator triages via the
      generated proposals).

  - id: spend_alert
    source_file: packages/analyzer/spend_alert.py
    monitors: intraday spend bursts + spend_alert's own self-failure (every 5m)
    signal_types:
      - cost_burst
      - self_failure_jsonl_discovery
    sweep_resolves: false
    evo_urgency_default: act
    evo_advice: >
      cost_burst: bot spent past the burst threshold in a short window
      (warn at threshold, alert at 3×); investigate via Usage tab.
      self_failure_jsonl_discovery: spend_alert itself can't read turn
      JSONL for some bots — the alerter is blind for them until fixed
      (check evolve user's read access to /Users/Shared/evolve/{bot}/turns/).

  - id: stuck_proposal_monitor
    source_file: packages/analyzer/stuck_proposal_monitor.py
    monitors: proposals sitting in approved/ past a threshold (default 7 days)
    signal_types: [stuck_proposal]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: >
      Catches the 2026-05-20 forensics failure mode (approved proposal
      stuck for a month because apply.py's idempotency check fired
      against a stale apply-results entry). Pod-scoped; one signal
      lists all stuck proposals. Operator either re-applies, archives,
      or unblocks the apply pipeline.

  - id: anthropic_admin_ingest
    source_file: packages/admin/evolve_admin/anthropic_admin_ingest.py
    monitors: daily reconciliation of local cost ledger against Anthropic admin API
    signal_types: [cost_diverges_from_anthropic]
    sweep_resolves: true
    evo_urgency_default: defer
    evo_advice: >
      Fires when the pod's local cost ledger disagrees with Anthropic's
      org-level cost report for the same day by more than the
      divergence threshold (default 10%). Usually a ledger / ingest gap
      worth investigating but not an emergency. No-ops cleanly when the
      admin key isn't configured.

  - id: app_structural_verifier
    source_file: packages/admin/evolve_admin/applications/audit_poller.py
    monitors: tier-2 structural audit findings from each bot's audit outbox
    signal_types: [varies — per-assertion finding ids from the audit catalog]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Structural-audit findings from the per-bot audit_runner. Severity
      depends on the assertion; outbox sweep-resolves cleared findings
      after each tier-2 run summary. Producer key is shared across bots
      — sweep_resolve doesn't take a bot filter.

  - id: infra_audit
    source_file: packages/admin/evolve_admin/applications/audit_poller.py
    monitors: infrastructure audit run health (sudoers, launchd, ACLs)
    signal_types: [infra_audit_run_failed]
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      Infra audits route findings directly into Proposals, not Signals
      — the one Signal type fires when the audit itself broke, meaning
      no infra Proposals will land until it's fixed. Pod-scoped, alert
      severity.

  - id: openclaw_posture
    source_file: packages/admin/evolve_admin/openclaw_posture/cli.py
    monitors: OpenClaw posture-doctor findings per bot (Phase 0.5)
    signal_types: [varies — per-rule lowercased code (e.g. exec_default_allow, oc_version_below_floor)]
    sweep_resolves: true
    evo_urgency_default: depends
    evo_advice: >
      Posture-doctor findings cover OC version floor, exec defaults,
      channel surface gaps, etc. Severity per rule drives urgency.
      sweep_resolve handles findings that no longer fire on the next
      run.

  - id: slack_config_probe
    source_file: packages/admin/evolve_admin/integrations/slack/probe.py
    monitors: per-bot Slack integration health (continuous reconciler)
    signal_types:
      - silent_blackhole
      - silent_blackhole_unverified
      - oc_default_drift
      - bot_invited_unwatched
    sweep_resolves: true
    evo_urgency_default: act
    evo_advice: >
      silent_blackhole (alert): bot is in a member channel but the
      allowlist excludes it — messages disappear with no reply. Act.
      oc_default_drift: visibleReplies setting unexpected. Act.
      bot_invited_unwatched: bot was invited but no entry exists yet
      (operator finalizes the wire-up). INFO findings don't emit
      Signals.

# ── Proposal generators ──────────────────────────────────────────────────────

generators:

  - id: app_birth_detector
    source_file: packages/analyzer/generators/app_birth_detector/charter.yaml
    cadence: weekly
    audience: bot_owner
    watches: orphan script+data clusters that look like an undeclared app
    proposes: BuildApp to formalize the cluster
    action_kinds: [BuildApp]
    evo_urgency_default: defer
    evo_advice: Hygiene improvement; bot is already using the app informally.

  - id: app_suggester
    source_file: packages/analyzer/generators/app_suggester/charter.yaml
    cadence: weekly
    audience: pod_operator
    watches: bot's existing apps + a curated catalog of common capabilities
    proposes: Investigation suggesting one uncovered catalog category per bot
    action_kinds: [Investigation]
    evo_urgency_default: defer
    evo_advice: >
      Exploratory "consider installing X" prompts (pure Python, no LLM).
      Long dwell time — does not auto-resolve on silence; the operator
      dismisses or accepts. Arbiter dedup/cooldown handles
      "don't re-suggest the same category."

  - id: auth_drift_filler
    source_file: packages/analyzer/generators/auth_drift_filler/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: perm_config_drift signals from permission_monitor
    proposes: ConfigPatch per drifted field, restoring baseline value
    action_kinds: [ConfigPatch]
    evo_urgency_default: act
    evo_advice: Permission drift is security-adjacent; act when firing — one proposal per drifted field, accept selectively.

  - id: budget_hawk
    source_file: packages/analyzer/generators/budget_hawk/charter.yaml
    cadence: hourly
    audience: pod_operator
    watches: cost anomalies, billing-mode issues, approaching pod cap
    proposes: tier downgrades, investigation, config patches
    action_kinds: [TierAdjustment, Investigation, ConfigPatch]
    evo_urgency_default: act
    evo_advice: Act when near cap — cost cascades fast.

  - id: cache_ttl_tuner
    source_file: packages/analyzer/generators/cache_ttl_tuner/charter.yaml
    cadence: daily
    audience: bot_owner
    watches: cache_invalidation_elevated / cache_hit_rate_low from session_economics
    proposes: which cache TTL knob to bump
    action_kinds: [Investigation]
    evo_urgency_default: defer
    evo_advice: Cost optimization, not a blocker.

  - id: cost_spike
    source_file: packages/analyzer/generators/cost_spike/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: cost_spike Signals from cost_watchdog (week-over-week relative change)
    proposes: Investigation so operator can compare context and decide intentional vs regression
    action_kinds: [Investigation]
    evo_urgency_default: depends
    evo_advice: >
      Distinct from budget_hawk (absolute cap). Sensor-style — proposal
      auto-archives when the upstream signal clears. Act if unexplained
      (heartbeat leak, runaway cron, accidental model upgrade); defer
      if you know the cause.

  - id: cron_caps_filler
    source_file: packages/analyzer/generators/cron_caps_filler/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: perm_cron_uncapped_agent_turn signals from permission_monitor
    proposes: UpsertCronJob to add maxTurns + maxBudgetUsd to uncapped agentTurn jobs
    action_kinds: [UpsertCronJob]
    evo_urgency_default: act
    evo_advice: Uncapped headless agent turns can burn unbounded budget; act when firing.

  - id: efficiency_hawk
    source_file: packages/analyzer/generators/efficiency_hawk/charter.yaml
    cadence: daily
    audience: bot_owner
    watches: high turn counts, tier misrouting, repetitive Q&A
    proposes: tier adjustments, workflow streamlines, manifest updates
    action_kinds: [TierAdjustment, AgentsAppend, WorkflowInstruction, ManifestUpdate, Investigation]
    evo_urgency_default: depends
    evo_advice: Act on high-severity entries; real cost drag.

  - id: evolve_watchdog
    source_file: packages/analyzer/generators/evolve_watchdog/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: RSI ecosystem health (noise drift, verification reliability, generator dominance)
    proposes: throttle or pause generators
    action_kinds: [ThrottleGenerator, PauseGenerator, Investigation]
    evo_urgency_default: act
    evo_advice: Evolve correcting itself is cascading risk; act now if firing.

  - id: gateway_diagnostician
    source_file: packages/analyzer/generators/gateway_diagnostician/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: gateway_instability watchdog signals
    proposes: specific heal config changes (timeout, retry, restart cooldown)
    action_kinds: [WorkflowInstruction, Investigation]
    evo_urgency_default: act
    evo_advice: Gateway instability blocks bot operation; act.

  - id: manifest_quality
    source_file: packages/analyzer/generators/manifest_quality/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: compliance_scan Signals — stale, test_failing, missing_required_field, validation_error
    proposes: Investigation per issue so operator can review the manifest
    action_kinds: [Investigation]
    evo_urgency_default: defer
    evo_advice: >
      Sensor-style — auto-archives when compliance_scan stops emitting
      the underlying Signal (operator updated last_reviewed, tests
      pass, field added, schema fixed). Right response depends on
      whether the app is still in use — operator decides.

  - id: persona_tuner
    source_file: packages/analyzer/generators/persona_tuner/charter.yaml
    cadence: weekly
    audience: bot_owner
    watches: mismatches between bot voice/tone and user preferences
    proposes: AGENTS.md additions, SoulEdit for deeper recalibrations
    action_kinds: [SoulEdit, AgentsAppend, Investigation]
    evo_urgency_default: defer
    evo_advice: UX polish; defer.

  - id: plugin_curator
    source_file: packages/analyzer/generators/plugin_curator/charter.yaml
    cadence: hourly
    audience: pod_operator
    watches: plugin allowlist / enable / disable / config drift
    proposes: UpdatePluginAllowDeny, EnablePluginEntry, DisablePluginEntry, UpdatePluginConfig
    action_kinds: [UpdatePluginAllowDeny, EnablePluginEntry, DisablePluginEntry, UpdatePluginConfig]
    evo_urgency_default: defer
    evo_advice: Baseline compliance tuning; rarely time-sensitive.

  - id: security_warden
    source_file: packages/analyzer/generators/security_warden/charter.yaml
    cadence: hourly
    audience: pod_operator
    watches: credential exposure, excessive scope, upstream OC version drift
    proposes: Investigation + ConfigPatch (auth/ACL hygiene)
    action_kinds: [Investigation, ConfigPatch]
    evo_urgency_default: act
    evo_advice: Security drift is critical; act when firing.

  - id: session_quality
    source_file: packages/analyzer/generators/session_quality/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: session_quality Signals from cost_watchdog — sessions dominated by config/housekeeping
    proposes: Investigation so operator can check for stuck loops, repeated auth errors, etc.
    action_kinds: [Investigation]
    evo_urgency_default: depends
    evo_advice: >
      Bot is burning sessions on maintenance overhead instead of
      productive output. Right response depends on what's causing it
      (loop, auth flap, misconfigured cron); operator context needed.
      Sensor-style — auto-archives when sessions normalize.

  - id: sysadmin_watchdog
    source_file: packages/analyzer/generators/sysadmin_watchdog/charter.yaml
    cadence: hourly
    audience: pod_operator
    watches: platform failures (gateway down, plugin missing, daemon not loaded, ACL drift)
    proposes: ConfigPatch for ACL restoration (others surface via Signals)
    action_kinds: [ConfigPatch]
    evo_urgency_default: act
    evo_advice: Act on critical findings (gateway/daemon down).

  - id: test_failure_responder
    source_file: packages/analyzer/generators/test_failure_responder/charter.yaml
    cadence: weekly
    audience: bot_owner
    watches: app test_command failures
    proposes: diagnosis Investigation
    action_kinds: [Investigation]
    evo_urgency_default: act
    evo_advice: Failed test blocks app readiness; act.

  - id: test_gate_backfill
    source_file: packages/analyzer/generators/test_gate_backfill/charter.yaml
    cadence: daily
    audience: bot_owner
    watches: legacy app manifests lacking test_command/test_cases/test_exemption_reason
    proposes: ManifestUpdate (when pattern matches "manual cron"), else Investigation
    action_kinds: [Investigation, ManifestUpdate]
    evo_urgency_default: defer
    evo_advice: Hygiene; new apps already gated.

  - id: user_profile_inferrer
    source_file: packages/analyzer/generators/user_profile_inferrer/
    cadence: per-session
    audience: bot_owner
    watches: session transcripts for user-fact extraction
    proposes: (no proposals — operates silently)
    action_kinds: []
    evo_urgency_default: defer
    evo_advice: >
      No proposals to act on. If operator asks "how does evolve know
      about me?", this is the answer: per-user profile maintained at
      ~/.openclaw/profiles/<user_key>.md, honors DNT.

  - id: workspace_inventory
    source_file: packages/analyzer/generators/workspace_inventory/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: compliance_scan Signals — unregistered_script, unregistered_cron
    proposes: Investigation per orphan so operator can register a manifest or delete the file
    action_kinds: [Investigation]
    evo_urgency_default: defer
    evo_advice: >
      Workspace contains scripts/crons no manifest claims. Usually
      "register the missing manifest" but sometimes "delete the orphan"
      — only the operator knows which. Sensor-style; auto-archives
      when the file/cron disappears or gets registered.

  - id: workspace_security
    source_file: packages/analyzer/generators/workspace_security/charter.yaml
    cadence: daily
    audience: pod_operator
    watches: misplaced_secret Signals from compliance_scan
    proposes: Investigation per credential find so operator can review the file
    action_kinds: [Investigation]
    evo_urgency_default: act
    evo_advice: >
      Severity skews critical — credentials in untracked workspace
      files are top-of-list. Investigation-shaped because the operator
      decides real leak vs documented sample, and remediation (rotate,
      redact, move) carries blast radius needing explicit approval.
