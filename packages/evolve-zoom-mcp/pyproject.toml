[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolve-zoom-mcp"
version = "0.1.0"
description = "Evolve-owned MCP shim for Zoom — proxies Zoom's hosted MCP for reads and implements meeting create/update/delete for writes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BUSL-1.1" }

dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "click>=8.1",
]

[project.scripts]
evolve-zoom-mcp = "evolve_zoom_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evolve_zoom_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
