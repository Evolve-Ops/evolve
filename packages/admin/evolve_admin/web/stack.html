<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Same per-theme address-bar colour pair as board.html — the two pages
     share one visual identity even though neither loads the other's CSS. -->
<meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131614" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="/board/icon-192.png">
<link rel="icon" href="/board/icon-192.png" type="image/png">
<title>Board — Stack</title>
<style>
  /* This page is standalone (no admin base.css) and several rules below set
     `display` on elements the script also toggles via the `hidden`
     attribute (.card, .drop-reasons, #button-row) — an author-origin
     `display` beats the UA's default `[hidden]{display:none}`, so without
     this override `el.hidden = true` would change nothing on screen. Must
     stay the FIRST rule in this block so nothing declared later can win a
     specificity tie by source order. */
  [hidden] { display: none !important; }
  /* D-ST1: a second page over the same store. Standalone like board.html —
     no admin base.css, its own token pair, sizes on the canonical scale
     (0.75 / 0.85 / 1 / 1.2). Deliberately the SAME token values as
     board.html so switching tabs never flashes a different theme. */
  :root {
    --bg: #f4f5f2;
    --bg2: #ffffff;
    --text: #1d221e;
    --muted: #62695f;
    --line: #dcdfd8;
    --accent: #2f7d4e;
    --accent-soft: #e3efe7;
    --warn: #a3661c;
    --shadow-lift: 0 10px 28px rgba(0, 0, 0, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131614;
      --bg2: #1c201d;
      --text: #e6eae5;
      --muted: #98a29a;
      --line: #2a302b;
      --accent: #5fb585;
      --accent-soft: #22322a;
      --warn: #d69a50;
      --shadow-lift: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
    font-size: 1rem;
    line-height: 1.4;
    height: 100vh;
    overflow: hidden;
  }
  header {
    position: sticky; top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 0.6rem 1rem 0.5rem;
    z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
  }
  .tabs { display: flex; gap: 0.4rem; }
  .tab {
    font-size: 0.85rem; font-weight: 600; text-decoration: none;
    color: var(--muted); padding: 0.2rem 0.5rem; border-radius: 999px;
  }
  .tab.on { color: var(--accent); background: var(--accent-soft); }
  .sub { font-size: 0.75rem; color: var(--muted); }
  #status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                background: var(--accent); margin-right: 0.35rem; }
  #status-dot.stale { background: var(--warn); }
  #error {
    display: none; margin: 0.6rem 1rem; padding: 0.7rem 0.85rem; border-radius: 10px;
    border: 1px solid var(--warn); color: var(--warn); font-size: 0.85rem;
  }
  main#stage {
    position: relative;
    height: calc(100% - 3.2rem);
    padding: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  #card-area {
    width: 100%; max-width: 420px; height: 100%; max-height: 560px;
    display: flex; flex-direction: column; gap: 0.6rem;
  }
  /* The card stack keeps the position:relative anchor .card's inset:0
     needs; #button-row sits OUTSIDE it, in normal flow, so the fallback
     controls are always inside the visible layout — never an off-screen
     negative offset gated behind a media query only the OS can see. */
  #card-stack { position: relative; flex: 1; min-height: 0; }
  .card {
    position: absolute; inset: 0;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 16px;
    padding: 1rem 1.1rem; box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column; gap: 0.5rem;
    touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overflow: hidden;
  }
  #peek-card {
    z-index: 1; transform: translateY(10px) scale(0.96); opacity: 0.6;
    pointer-events: none;
  }
  #top-card { z-index: 2; transition: transform 0.25s ease, opacity 0.25s ease; }
  #top-card.dragging { transition: none; }
  #top-card.at-up { background: var(--bg2); }
  #top-card.at-down { background: var(--bg2); }
  #top-card.at-right { background: var(--accent-soft); }
  #top-card.at-left { background: var(--bg2); border-color: var(--warn); }
  .card.owner-bot { border-left: 4px double var(--accent); }
  .card-body { display: flex; flex-direction: column; gap: 0.5rem; overflow: hidden; }
  .title { font-size: 1.2rem; font-weight: 700; }
  .facts, .why { font-size: 0.85rem; color: var(--muted); }
  .tag {
    align-self: flex-start; font-size: 0.75rem; padding: 0.1rem 0.5rem;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  }
  .tag.untrusted { background: none; border: 1px solid var(--warn); color: var(--warn); }
  .actions { display: flex; flex-direction: column; gap: 0.4rem; margin-top: auto; }
  .actions button, .decision-row button, #later-btn {
    font: inherit; font-size: 0.85rem; font-weight: 600; text-align: left;
    padding: 0.55rem 0.7rem; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    cursor: pointer;
  }
  .actions button:disabled { color: var(--muted); cursor: default; }
  .decision-row { display: flex; gap: 0.5rem; margin-top: auto; }
  .decision-row button { flex: 1; text-align: center; }
  .decision-row .primary { background: var(--accent); border-color: var(--accent); color: var(--bg2); }
  #later-btn { align-self: flex-start; }
  .instructed-badge { font-size: 0.85rem; color: var(--accent); margin-top: auto; }
  /* D-ST9: the four edge hints. Icon + one word, on by default. */
  .hint {
    position: absolute; font-size: 0.75rem; font-weight: 600; color: var(--muted);
    opacity: 0.55; transition: opacity 0.15s ease, transform 0.15s ease, color 0.15s ease;
    pointer-events: none;
  }
  .hint-up { top: 0.5rem; left: 50%; transform: translateX(-50%); }
  .hint-down { bottom: 0.5rem; left: 50%; transform: translateX(-50%); }
  .hint-left { left: 0.5rem; top: 50%; transform: translateY(-50%); }
  .hint-right { right: 0.5rem; top: 50%; transform: translateY(-50%); }
  .hint.hint-fade { opacity: 0.15; }
  .hint.hint-active { opacity: 1; transform: scale(1.25) translateX(-50%); color: var(--text); }
  .hint-left.hint-active, .hint-right.hint-active { transform: scale(1.25) translateY(-50%); }
  .hint-right.hint-active { color: var(--accent); }
  .hint-left.hint-active { color: var(--warn); }
  body.hints-off .hint { display: none; }
  .drop-reasons {
    position: absolute; inset: auto 0 0 0; background: var(--bg2);
    border-top: 1px solid var(--warn); padding: 0.6rem; display: flex;
    flex-wrap: wrap; gap: 0.4rem; z-index: 3;
  }
  .drop-reasons button {
    font: inherit; font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: 999px;
    border: 1px solid var(--warn); background: var(--bg); color: var(--warn); cursor: pointer;
  }
  .third-pass-strip {
    border: 1px solid var(--warn); border-radius: 10px; padding: 0.6rem;
    font-size: 0.85rem; color: var(--warn);
  }
  .third-pass-strip .row { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .third-pass-strip button {
    font: inherit; font-size: 0.8rem; padding: 0.4rem 0.6rem; border-radius: 8px;
    border: 1px solid var(--warn); background: var(--bg); color: var(--text); cursor: pointer;
  }
  #button-row {
    display: flex; gap: 0.5rem; justify-content: center; flex-shrink: 0;
  }
  #button-row button {
    font: inherit; font-size: 0.8rem; font-weight: 600; padding: 0.5rem 0.7rem;
    border-radius: 999px; border: 1px solid var(--line); background: var(--bg2);
    color: var(--text); cursor: pointer;
  }
  #empty-state { text-align: center; padding: 1rem; max-width: 380px; }
  .empty-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.6rem; }
  #plate-list { font-size: 0.85rem; color: var(--text); text-align: left; margin: 0.6rem 0; }
  #plate-list .plate-row { padding: 0.25rem 0; border-bottom: 1px solid var(--line); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  #hint-toggle-btn {
    font: inherit; font-size: 0.8rem; margin-top: 0.8rem; padding: 0.4rem 0.7rem;
    border-radius: 999px; border: 1px solid var(--line); background: var(--bg2);
    color: var(--muted); cursor: pointer;
  }
  #undo-toast {
    position: fixed; left: 1rem; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom));
    z-index: 12; background: var(--text); color: var(--bg);
    border-radius: 10px; padding: 0.6rem 0.85rem;
    display: flex; align-items: center; justify-content: space-between; gap: 0.7rem;
    box-shadow: var(--shadow-lift);
  }
  #undo-btn {
    font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent);
    background: none; border: none; cursor: pointer;
  }
  /* ── sheets (same conventions as board.html) ── */
  #backdrop {
    display: none; position: fixed; inset: 0; z-index: 9; background: var(--bg); opacity: 0.7;
  }
  .sheet {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bg2); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto;
  }
  .sheet h3 { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.7rem; font-weight: 600; }
  .sheet .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .sheet button {
    font: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.55rem 0.9rem;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); cursor: pointer;
  }
  .sheet button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg2); }
  .sheet button.quiet { border: none; background: none; color: var(--muted); }
  .detail-meta { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.6rem; }
  .detail-group { margin-bottom: 0.7rem; }
  .detail-group h4 {
    font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 0.35rem; font-weight: 600;
  }
  .detail-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 0.5rem; padding: 0.4rem 0; border-bottom: 1px solid var(--line); font-size: 0.85rem;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .detail-row .src { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
  .detail-row.untrusted a { color: var(--warn); }
  .action-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.5rem; padding: 0.3rem 0;
  }
  .action-row button {
    font: inherit; font-size: 0.85rem; font-weight: 600; text-align: left; flex: 1;
    padding: 0.5rem 0.7rem; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  .action-row button:disabled { color: var(--muted); cursor: default; }
  .action-row .cost { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  noscript { display: block; padding: 1rem; text-align: center; }
</style>
</head>
<body>
<noscript>
  <!-- No server-side templating exists for this page (board.html and this
       page are both read verbatim off disk, deliberately — the shipped
       test suite pins "no card data baked into the page"), so the bot id
       needed for a real link to the lane board is not known here without
       JS. A plain instruction, not a guessed href. -->
  <p>The Stack needs JavaScript to load your cards. Remove "/stack" from
     this page's address to open the lane board instead — it needs no
     script to show its lanes.</p>
</noscript>
<header>
  <div class="tabs">
    <a id="tab-stack" class="tab on" href="#">Stack</a>
    <a id="tab-board" class="tab" href="#">Board</a>
  </div>
  <div class="sub"><span id="status-dot"></span><span id="status-text">loading…</span></div>
</header>
<div id="error"></div>
<main id="stage">
  <div id="empty-state" hidden>
    <div class="empty-title">You're clear.</div>
    <div id="plate-list"></div>
    <div id="today-stats" class="muted"></div>
    <button id="hint-toggle-btn"></button>
  </div>
  <div id="card-area" hidden>
    <div id="card-stack">
      <div id="peek-card" class="card" hidden></div>
      <div id="top-card" class="card" hidden>
        <div id="hint-up" class="hint hint-up">↑ pass</div>
        <div id="hint-down" class="hint hint-down">↓ talk</div>
        <div id="hint-left" class="hint hint-left">← drop</div>
        <div id="hint-right" class="hint hint-right">→ done</div>
        <div class="card-body" id="card-body"></div>
        <div class="drop-reasons" id="drop-reasons" hidden></div>
      </div>
    </div>
    <div id="button-row" hidden>
      <button id="btn-up">↑ Pass</button>
      <button id="btn-down">↓ Talk</button>
      <button id="btn-left">← Drop</button>
      <button id="btn-right">→ Done</button>
    </div>
  </div>
</main>

<div id="undo-toast" hidden>
  <span id="undo-text"></span>
  <button id="undo-btn">Undo</button>
</div>

<div id="backdrop"></div>
<div class="sheet" id="detail-sheet">
  <h3 id="detail-title"></h3>
  <div class="detail-meta" id="detail-meta"></div>
  <div id="detail-body"></div>
  <div class="row" style="margin-top:0.7rem">
    <button class="quiet" id="detail-close">Close</button>
  </div>
</div>
<div class="sheet" id="later-sheet">
  <h3>When should this come back?</h3>
  <div class="row" id="later-row"></div>
  <div class="row" style="margin-top:0.7rem">
    <button class="quiet" id="later-cancel">Cancel</button>
  </div>
</div>

<script>
"use strict";
(function () {
  var botId = location.pathname.split("/").filter(Boolean).slice(-2)[0];
  var token = new URLSearchParams(location.search).get("t") || "";
  if (token && window.history && history.replaceState) {
    history.replaceState(null, "", location.pathname);
  }

  (function () {
    var l = document.createElement("link");
    l.rel = "manifest";
    l.href = "/board/" + encodeURIComponent(botId) + "/manifest.webmanifest";
    document.head.appendChild(l);
  })();

  // ── the D-ST1 view cookie: an explicit tab choice always wins the
  // viewport heuristic on the next load, on THIS or the lane board. Plain
  // (non-HttpOnly) — it carries no credential, only "which page did this
  // device pick last" — and scoped to both board pages of this bot, the
  // same two-path split board_auth.py uses for the real auth cookie.
  var VIEW_COOKIE = "evolve_board_view";
  var HINTS_COOKIE = "evolve_board_hints";
  function setCookie(name, value, days) {
    var attrs = "; path=/board/" + encodeURIComponent(botId) +
      "; max-age=" + (days * 24 * 3600) + "; samesite=lax";
    try { document.cookie = name + "=" + value + attrs; } catch (e) { /* ignore */ }
  }
  function getCookie(name) {
    try {
      var m = (document.cookie || "").match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
      return m ? decodeURIComponent(m[1]) : null;
    } catch (e) { return null; }
  }
  var tabBoard = document.getElementById("tab-board");
  tabBoard.href = "/board/" + encodeURIComponent(botId);
  tabBoard.onclick = function () {
    setCookie(VIEW_COOKIE, "board", 400);
  };

  var REDUCED_MOTION = !!(window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  var hintsOff = getCookie(HINTS_COOKIE) === "off";
  if (hintsOff) document.body.classList.add("hints-off");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function api(path, opts) {
    opts = opts || {};
    opts.credentials = "same-origin";
    opts.headers = Object.assign({}, opts.headers || {});
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    return fetch("/api/board/" + encodeURIComponent(botId) + path, opts);
  }
  function post(path, body) {
    return api(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) {
        throw new Error(b.error || ("write failed (" + r.status + ")"));
      });
      return r.json();
    });
  }
  function postMove(card, extra) {
    var body = Object.assign({}, extra);
    return post("/cards/" + card.id + "/move", body).catch(function (e) { fail(e.message); });
  }

  function fail(msg) {
    var e = document.getElementById("error");
    e.textContent = msg;
    e.style.display = "block";
    document.getElementById("status-dot").classList.add("stale");
    document.getElementById("status-text").textContent = "not connected";
  }

  // ── state ────────────────────────────────────────────────────────────
  var queue = [];          // items still to decide, current top at [0]
  var totalEver = 0;       // "N of M": M, fixed per fetch
  var resolvedCount = 0;   // N-1: how many left the queue for good since then
  var thirdPass = {};      // card id -> true, once warn_third_pass fires
  var undoTimer = null;
  var pendingRefresh = false;

  function fetchStack() {
    api("/stack", {}).then(function (r) {
      if (r.status === 401) { fail("This link's token was not accepted. Ask the operator for a fresh board link."); return null; }
      if (!r.ok) { fail("Stack unavailable (" + r.status + ")."); return null; }
      return r.json();
    }).then(function (data) {
      if (!data) return;
      if (drag) { pendingRefresh = true; return; }
      document.getElementById("error").style.display = "none";
      document.getElementById("status-dot").classList.remove("stale");
      document.getElementById("status-text").textContent =
        "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      queue = data.items || [];
      totalEver = queue.length;
      resolvedCount = 0;
      renderEmptyState(data.empty_state);
      renderTop();
    }).catch(function () { fail("No connection to the pod. Are you on the home network / tailnet?"); });
  }

  function renderEmptyState(emptyState) {
    var isEmpty = !queue.length;
    document.getElementById("empty-state").hidden = !isEmpty;
    document.getElementById("card-area").hidden = isEmpty;
    if (!isEmpty || !emptyState) return;
    var plate = document.getElementById("plate-list");
    plate.replaceChildren();
    (emptyState.bots_plate || []).forEach(function (c) {
      var state = (c.delegation && c.delegation.state) || "";
      plate.appendChild(el("div", "plate-row", c.title + (state ? " — " + state.replace(/_/g, " ") : "")));
    });
    if (!(emptyState.bots_plate || []).length) {
      plate.appendChild(el("div", "plate-row", "Nothing on the bot right now."));
    }
    document.getElementById("today-stats").textContent =
      "done today " + (emptyState.done_today || 0) +
      " · dropped " + (emptyState.dropped_today || 0) +
      " · handed off " + (emptyState.handed_off_today || 0);
    var toggle = document.getElementById("hint-toggle-btn");
    toggle.textContent = hintsOff ? "show gesture hints" : "hide gesture hints";
    toggle.onclick = toggleHints;
  }

  function toggleHints() {
    hintsOff = !hintsOff;
    document.body.classList.toggle("hints-off", hintsOff);
    setCookie(HINTS_COOKIE, hintsOff ? "off" : "on", 400);
    var toggle = document.getElementById("hint-toggle-btn");
    if (toggle) toggle.textContent = hintsOff ? "show gesture hints" : "hide gesture hints";
  }

  // ── card face (D-ST6) ──────────────────────────────────────────────────
  function whenLine(card) {
    var e = card.enrichment || {};
    var parts = [];
    if (e.when) {
      var w = e.when.value;
      var start = typeof w === "string" ? w : (w && w.start);
      if (start) {
        var d = new Date(start);
        parts.push(isNaN(d.getTime()) ? start :
          d.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }));
      }
    }
    if (e.location && e.location.value && e.location.value.text) {
      parts.push(e.location.value.text);
    }
    return parts.join(" · ");
  }

  function sourceTag(card) {
    var t = el("span", "tag" + (card.source === "email" ? " untrusted" : ""),
      card.source === "email" ? "from email — unverified" : "from " + (card.source || "manual"));
    return t;
  }

  function renderActions(card, body) {
    if (card.owner === "bot") {
      var state = card.delegation && card.delegation.state;
      if (state === "returned_for_review") {
        var row = el("div", "decision-row");
        var approve = el("button", "primary", "Approve");
        approve.onclick = function () { decide(card, "approve"); };
        var decline = el("button", null, "Decline");
        decline.onclick = function () { decide(card, "decline"); };
        row.appendChild(approve); row.appendChild(decline);
        body.appendChild(row);
      } else {
        var cost = card.delegation && card.delegation.cost_to_date;
        body.appendChild(el("div", "instructed-badge",
          (state ? state.replace(/_/g, " ") : "working on it") +
          (cost != null ? " · $" + Number(cost).toFixed(2) + " so far" : "")));
      }
      return;
    }
    var actions = (card.actions || []).slice(0, 3);
    if (actions.length) {
      var group = el("div", "actions");
      actions.forEach(function (a) {
        var b = el("button", null, a.label +
          (a.disabled_reason ? "" : (a.est_cost ? " — est $" + Number(a.est_cost).toFixed(2) : " — $0")));
        if (a.disabled_reason) { b.disabled = true; b.title = a.disabled_reason; }
        else {
          var armed = false;
          b.onclick = function () {
            if (a.requires_confirm && !armed) { armed = true; b.textContent = "Tap again to confirm"; return; }
            b.disabled = true;
            post("/cards/" + card.id + "/instruct",
              a.requires_confirm ? { action_id: a.id, confirm: true } : { action_id: a.id })
              .then(function () {
                resolveTop("Handed to the bot" + (a.est_cost ? " — est $" + Number(a.est_cost).toFixed(2) : "") + ".");
              }).catch(function (e) { b.disabled = false; fail(e.message); });
          };
        }
        group.appendChild(b);
      });
      body.appendChild(group);
    }
    var later = el("button", null, "Later");
    later.id = "later-btn";
    later.onclick = function () { openLaterSheet(card); };
    body.appendChild(later);
  }

  function renderThirdPassStrip(card, body) {
    var strip = el("div", "third-pass-strip",
      "You keep skipping this — what should happen to it?");
    var row = el("div", "row");
    var later = el("button", null, "Later");
    later.onclick = function () { openLaterSheet(card); };
    var drop = el("button", null, "Drop");
    drop.onclick = function () { startDrop(card); };
    var hand = el("button", null, "Hand it to me");
    hand.onclick = function () {
      post("/cards/" + card.id + "/assign", { owner: "bot" })
        .then(function () { resolveTop("Handed to the bot."); })
        .catch(function (e) { fail(e.message); });
    };
    row.appendChild(later); row.appendChild(drop); row.appendChild(hand);
    strip.appendChild(row);
    body.appendChild(strip);
  }

  function renderTop() {
    var top = document.getElementById("top-card");
    var peek = document.getElementById("peek-card");
    var buttonRow = document.getElementById("button-row");
    if (!queue.length) { top.hidden = true; peek.hidden = true; renderEmptyState(null); return; }
    top.hidden = false;
    top.className = "card";
    top.style.transform = "";
    top.style.opacity = "";
    var item = queue[0];
    var body = document.getElementById("card-body");
    body.replaceChildren();
    document.getElementById("drop-reasons").hidden = true;
    if (item.kind === "briefing") {
      top.classList.remove("owner-bot");
      body.appendChild(el("div", "title", item.briefing.title || "This morning"));
      body.appendChild(el("div", "facts", item.briefing.summary || ""));
    } else {
      var card = item.card;
      top.classList.toggle("owner-bot", card.owner === "bot");
      body.appendChild(el("div", "title", card.title));
      var when = whenLine(card);
      if (when) body.appendChild(el("div", "facts", when));
      body.appendChild(sourceTag(card));
      body.appendChild(el("div", "why", card.why_line || ""));
      if (thirdPass[card.id]) renderThirdPassStrip(card, body);
      else renderActions(card, body);
    }
    peek.hidden = queue.length < 2;
    document.getElementById("status-text").textContent =
      Math.min(resolvedCount + 1, totalEver) + " of " + totalEver +
      (item.kind === "card" ? " · " + item.card.lane : " · briefing");
    // The four buttons are a fallback for every viewer, not just reduced
    // motion — a swipe gesture needs discovering, a labelled button doesn't.
    // REDUCED_MOTION only turns off the drag animation itself (see the
    // pointerdown handler below), never this row's visibility.
    buttonRow.hidden = false;
  }

  // ── the four outcomes ───────────────────────────────────────────────────

  function showUndoToast(label, inverse) {
    clearTimeout(undoTimer);
    document.getElementById("undo-text").textContent = label;
    var toast = document.getElementById("undo-toast");
    var btn = document.getElementById("undo-btn");
    toast.hidden = false;
    btn.disabled = false;
    btn.onclick = function () {
      clearTimeout(undoTimer);
      toast.hidden = true;
      inverse();
    };
    undoTimer = setTimeout(function () {
      toast.hidden = true;
      // A lapsed Undo must go dead, not just invisible — clearing onclick
      // (and disabling the button) means a tap that lands after the window
      // closes can never re-fire a move the user no longer asked for.
      btn.onclick = null;
      btn.disabled = true;
    }, 3000);
  }

  // A tap: leaves the queue for good (action taps, decisions, Later).
  function resolveTop(message) {
    queue.shift();
    resolvedCount++;
    renderTop();
    if (message) showToastMessage(message);
    if (!queue.length) fetchStack();
  }
  function showToastMessage(text) {
    document.getElementById("undo-text").textContent = text;
    var toast = document.getElementById("undo-toast");
    document.getElementById("undo-btn").onclick = function () { toast.hidden = true; };
    document.getElementById("undo-btn").style.visibility = "hidden";
    toast.hidden = false;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () {
      toast.hidden = true;
      document.getElementById("undo-btn").style.visibility = "";
    }, 3000);
  }

  function doPass(item) {
    if (item.kind !== "card") { queue.push(queue.shift()); renderTop(); return; }
    var card = item.card;
    queue.push(queue.shift());
    renderTop();
    post("/cards/" + card.id + "/seen", {}).then(function (res) {
      if (res.warn_third_pass) { thirdPass[card.id] = true; if (queue[0] === item) renderTop(); }
    }).catch(function () {});
    showUndoToast("Passed.", function () {
      queue.unshift(queue.pop());
      renderTop();
      post("/cards/" + card.id + "/seen", { undo: true }).catch(function () {});
    });
  }

  function doTalk(item) {
    if (item.kind === "card") openDetailSheet(item.card);
  }

  // Persist-then-animate (Done and Drop, below): the card only leaves the
  // queue once the server has confirmed the move. A failed write leaves
  // queue[0] untouched and the top card still showing — never a header
  // banner floated over a card that already looks gone.
  function doDone(item) {
    if (item.kind !== "card") { resolveTop(); return; }
    var card = item.card;
    var fromLane = card.lane;
    post("/cards/" + card.id + "/move", { to_lane: "done" }).then(function () {
      queue.shift();
      resolvedCount++;
      renderTop();
      showUndoToast("Done.", function () {
        post("/cards/" + card.id + "/move", { to_lane: fromLane || "today" }).then(function () {
          resolvedCount = Math.max(0, resolvedCount - 1);
          queue.unshift(item);
          renderTop();
        }).catch(function () { showToastMessage("couldn't save — try again."); });
      });
      if (!queue.length) fetchStack();
    }).catch(function () { showToastMessage("couldn't save — try again."); });
  }

  function startDrop(item) {
    if (item.kind !== "card") { resolveTop(); return; }
    var card = item.card;
    var overlay = document.getElementById("drop-reasons");
    overlay.replaceChildren();
    var settled = false;
    var REASONS = ["not mine", "already handled", "never", "later than later"];
    REASONS.forEach(function (reason) {
      var b = el("button", null, reason);
      b.onclick = function () { finish(reason); };
      overlay.appendChild(b);
    });
    overlay.hidden = false;
    var timer = setTimeout(function () { finish(null); }, 1000);
    function finish(reason) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      overlay.hidden = true;
      var fromLane = card.lane;
      var body = { to_lane: "dropped" };
      if (reason) body.reason = reason;
      post("/cards/" + card.id + "/move", body).then(function () {
        queue.shift();
        resolvedCount++;
        renderTop();
        showUndoToast("Dropped." + (reason ? " (" + reason + ")" : ""), function () {
          post("/cards/" + card.id + "/move", { to_lane: fromLane || "inbox" }).then(function () {
            resolvedCount = Math.max(0, resolvedCount - 1);
            queue.unshift(item);
            renderTop();
          }).catch(function () { showToastMessage("couldn't save — try again."); });
        });
        if (!queue.length) fetchStack();
      }).catch(function () { showToastMessage("couldn't save — try again."); });
    }
  }

  function commit(direction, item) {
    if (direction === "up") doPass(item);
    else if (direction === "down") doTalk(item);
    else if (direction === "right") doDone(item);
    else if (direction === "left") startDrop(item);
  }

  ["up", "down", "left", "right"].forEach(function (dir) {
    document.getElementById("btn-" + dir).onclick = function () {
      if (queue.length) commit(dir, queue[0]);
    };
  });

  // ── Later (D-ST4) ──────────────────────────────────────────────────────
  function snoozeDate(preset) {
    var d = new Date();
    if (preset === "tomorrow") {
      d.setDate(d.getDate() + 1);
    } else if (preset === "this weekend") {
      var addSat = ((6 - d.getDay()) + 7) % 7 || 7;
      d.setDate(d.getDate() + addSat);
    } else if (preset === "next week") {
      var addMon = ((8 - d.getDay())) % 7 || 7;
      d.setDate(d.getDate() + addMon);
    }
    d.setHours(9, 0, 0, 0);
    return d.toISOString().slice(0, 19) + "Z";
  }

  function openLaterSheet(card) {
    var row = document.getElementById("later-row");
    row.replaceChildren();
    ["tomorrow", "this weekend", "next week"].forEach(function (preset) {
      var b = el("button", null, preset);
      b.onclick = function () {
        closeSheets();
        postMove(card, { to_lane: "later", snooze_until: snoozeDate(preset) });
        resolveTop("Later — " + preset + ".");
      };
      row.appendChild(b);
    });
    showSheet("later-sheet");
  }

  function decide(card, decision) {
    post("/cards/" + card.id + "/decision", { decision: decision })
      .then(function () { resolveTop(decision === "approve" ? "Approved." : "Declined."); })
      .catch(function (e) { fail(e.message); });
  }

  // ── detail sheet (D-BI3/D-BI5, reused from the lane board) ─────────────
  function showSheet(id) {
    document.getElementById("backdrop").style.display = "block";
    document.getElementById(id).style.display = "block";
  }
  function closeSheets() {
    document.getElementById("backdrop").style.display = "none";
    ["detail-sheet", "later-sheet"].forEach(function (id) {
      document.getElementById(id).style.display = "none";
    });
  }
  document.getElementById("backdrop").onclick = closeSheets;
  document.getElementById("detail-close").onclick = closeSheets;
  document.getElementById("later-cancel").onclick = closeSheets;

  function armableLink(href, text, untrusted) {
    var a = document.createElement("a");
    a.textContent = text;
    if (!untrusted) { a.href = href; return a; }
    a.href = "#";
    a.onclick = function (ev) {
      if (a.dataset.armed !== "1") {
        if (ev.preventDefault) ev.preventDefault();
        a.dataset.armed = "1";
        a.href = href;
        a.textContent = text + " — tap again";
      }
    };
    return a;
  }
  function detailRow(node, source) {
    var row = el("div", "detail-row" + (source === "email" ? " untrusted" : ""));
    row.appendChild(node);
    if (source) row.appendChild(el("span", "src", "from " + source));
    return row;
  }
  var ENRICHMENT_GROUP_LABELS = { contacts: "Contacts", location: "Location", when: "When", links: "Links" };
  function enrichmentDetail(card) {
    var e = card.enrichment;
    if (!e) return null;
    var group = el("div", "detail-group");
    group.appendChild(el("h4", null, "Details"));
    var any = false;
    Object.keys(ENRICHMENT_GROUP_LABELS).forEach(function (key) {
      var field = e[key];
      if (!field) return;
      var untrusted = field.source === "email";
      if (key === "contacts") {
        (field.value || []).forEach(function (c) {
          var src = c.source || field.source;
          var wrap = document.createElement("span");
          wrap.appendChild(document.createTextNode(c.name));
          if (c.phone) { wrap.appendChild(document.createTextNode(" ")); wrap.appendChild(armableLink("tel:" + c.phone, c.phone, src === "email")); }
          if (c.email) { wrap.appendChild(document.createTextNode(" ")); wrap.appendChild(armableLink("mailto:" + c.email, c.email, src === "email")); }
          group.appendChild(detailRow(wrap, src));
          any = true;
        });
      } else if (key === "location") {
        var loc = field.value || {};
        var mapsUrl = loc.maps_url || ("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(loc.text || ""));
        group.appendChild(detailRow(armableLink(mapsUrl, loc.text || "map", untrusted), field.source));
        any = true;
      } else if (key === "when") {
        var w = field.value;
        var text = typeof w === "string" ? w : ((w && w.start) || "");
        if (w && typeof w === "object" && w.end) text += " – " + w.end;
        group.appendChild(detailRow(el("span", null, text), field.source));
        any = true;
      } else if (key === "links") {
        (field.value || []).forEach(function (l) {
          group.appendChild(detailRow(armableLink(l.url, l.label || l.url, untrusted), field.source));
          any = true;
        });
      }
    });
    return any ? group : null;
  }

  function openDetailSheet(card) {
    document.getElementById("detail-title").textContent = card.title;
    var meta = document.getElementById("detail-meta");
    var parts = [card.cluster, card.lane, (card.owner === "bot" ? "on the bot" : "yours")];
    if (card.delegation && card.delegation.state) parts.push(card.delegation.state.replace(/_/g, " "));
    meta.textContent = parts.join(" · ");
    var body = document.getElementById("detail-body");
    body.replaceChildren();
    if (card.note) body.appendChild(el("div", "facts", card.note));
    var enrichment = enrichmentDetail(card);
    if (enrichment) body.appendChild(enrichment);
    showSheet("detail-sheet");
  }

  // ── gestures (D-ST3) — Pointer Events, same discipline as board.html's
  // press-and-hold drag: touch-action:none on the card, one gesture per
  // finger, contextmenu suppressed while a finger is down. ────────────────
  var SLOP_PX = 10;
  var THRESHOLD_FRACTION = 0.35;
  var VELOCITY_PX_MS = 0.6;
  var drag = null; // {pointerId, startX, startY, axis, lastX, lastY, lastTs, dragging}

  function otherPointer(ev) {
    return drag && ev.pointerId !== undefined && drag.pointerId !== undefined &&
           ev.pointerId !== drag.pointerId;
  }

  document.getElementById("top-card").addEventListener("pointerdown", function (ev) {
    if (REDUCED_MOTION) return;
    if (ev.target && ev.target.closest && ev.target.closest("button, a")) return;
    if (!queue.length) return;
    drag = {
      pointerId: ev.pointerId, startX: ev.clientX, startY: ev.clientY,
      lastX: ev.clientX, lastY: ev.clientY, lastTs: ev.timeStamp || 0,
      prevX: ev.clientX, prevY: ev.clientY, prevTs: ev.timeStamp || 0,
      axis: null, dragging: false,
    };
  });

  document.addEventListener("pointermove", function (ev) {
    if (!drag || otherPointer(ev)) return;
    var dx = ev.clientX - drag.startX, dy = ev.clientY - drag.startY;
    if (!drag.dragging) {
      if (Math.abs(dx) < SLOP_PX && Math.abs(dy) < SLOP_PX) return;
      drag.dragging = true;
      drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      document.getElementById("top-card").classList.add("dragging");
    }
    // The velocity a flick is judged on is the SECOND-TO-LAST -> LAST move,
    // never "last move -> pointerup" — a real release (and this harness)
    // often reports pointerup at the exact same coordinates as the final
    // move, which would make every gesture read as a zero-distance,
    // zero-time "flick" if the up event were one side of the measurement.
    drag.prevX = drag.lastX; drag.prevY = drag.lastY; drag.prevTs = drag.lastTs;
    drag.lastX = ev.clientX; drag.lastY = ev.clientY; drag.lastTs = ev.timeStamp || drag.lastTs;
    var top = document.getElementById("top-card");
    var rect = top.getBoundingClientRect();
    var delta = drag.axis === "x" ? dx : dy;
    var dim = drag.axis === "x" ? rect.width : rect.height;
    var progress = Math.min(1, Math.abs(delta) / (dim * THRESHOLD_FRACTION));
    var tx = drag.axis === "x" ? dx : 0;
    var ty = drag.axis === "y" ? dy : 0;
    top.style.transform = "translate(" + tx + "px," + ty + "px) rotate(" + (tx / 24) + "deg)";
    highlightHints(drag.axis, delta, progress);
  });

  var HINT_IDS = ["up", "down", "left", "right"];
  function directionFor(axis, delta) {
    if (axis === "y") return delta < 0 ? "up" : "down";
    return delta > 0 ? "right" : "left";
  }
  var tinted = false;
  function highlightHints(axis, delta, progress) {
    var dir = directionFor(axis, delta);
    HINT_IDS.forEach(function (key) {
      var node = document.getElementById("hint-" + key);
      if (!node) return;
      node.classList.toggle("hint-active", key === dir);
      node.classList.toggle("hint-fade", key !== dir);
    });
    var top = document.getElementById("top-card");
    top.classList.toggle("at-" + dir, progress >= 1);
    ["up", "down", "left", "right"].forEach(function (key) {
      if (key !== dir) top.classList.remove("at-" + key);
    });
    if (progress >= 1 && !tinted) {
      tinted = true;
      if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) { /* no haptics */ } }
    } else if (progress < 1) {
      tinted = false;
    }
  }

  function resetHints() {
    HINT_IDS.forEach(function (key) {
      var node = document.getElementById("hint-" + key);
      if (node) { node.classList.remove("hint-active"); node.classList.remove("hint-fade"); }
    });
    var top = document.getElementById("top-card");
    ["up", "down", "left", "right"].forEach(function (key) { top.classList.remove("at-" + key); });
    tinted = false;
  }

  function endGesture(commitIt) {
    var top = document.getElementById("top-card");
    top.classList.remove("dragging");
    if (!commitIt) {
      top.style.transform = "";
      resetHints();
    }
    drag = null;
    if (pendingRefresh) { pendingRefresh = false; fetchStack(); }
  }

  document.addEventListener("pointerup", function (ev) {
    if (!drag || otherPointer(ev)) return;
    if (!drag.dragging) {
      // A tap: the item under the finger when it went DOWN, not whatever
      // is on top after endGesture() flushes a poll that landed mid-tap
      // (board.html's own pendingRender deferral has the same shape).
      var tapped = queue[0];
      endGesture(false);
      if (tapped) doTalk(tapped);
      return;
    }
    var dx = drag.lastX - drag.startX, dy = drag.lastY - drag.startY;
    var delta = drag.axis === "x" ? dx : dy;
    var top = document.getElementById("top-card");
    var rect = top.getBoundingClientRect();
    var dim = drag.axis === "x" ? rect.width : rect.height;
    var progress = Math.abs(delta) / (dim * THRESHOLD_FRACTION);
    var dt = drag.lastTs - drag.prevTs;
    var finalDx = drag.lastX - drag.prevX, finalDy = drag.lastY - drag.prevY;
    var finalDelta = drag.axis === "x" ? finalDx : finalDy;
    var flick = dt > 0 && Math.abs(finalDelta) / dt >= VELOCITY_PX_MS;
    var willCommit = progress >= 1 || flick;
    resetHints();
    if (willCommit && queue.length) {
      var dir = directionFor(drag.axis, delta || finalDelta);
      endGesture(true);
      commit(dir, queue[0]);
    } else {
      endGesture(false);
    }
  });

  document.addEventListener("pointercancel", function (ev) {
    if (!drag || otherPointer(ev)) return;
    endGesture(false);
  });

  document.addEventListener("contextmenu", function (ev) {
    if (drag && drag.dragging && ev.preventDefault) ev.preventDefault();
  });
  document.addEventListener("touchmove", function (ev) {
    if (drag && drag.dragging && ev.cancelable !== false && ev.preventDefault) ev.preventDefault();
  }, { passive: false });

  fetchStack();
  setInterval(fetchStack, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) fetchStack();
  });
})();
</script>
</body>
</html>
