<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolve Pods</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      The local "chrome" webview. It paints the tab strip (top 40px band) and,
      when the pod webviews are parked, the full-window settings / empty / error
      surfaces. The remote pod content lives in separate webviews layered on top
      of this one — never in an iframe.
    -->
    <header id="bar"></header>
    <main id="content"></main>
    <script src="main.js"></script>
  </body>
</html>
